name: Test data server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/test-server.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - name: Check history, search, news and swing scanner
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "server")
          from app import app
          c = app.test_client()
          for sym in ["KO", "005930"]:
              r = c.get(f"/api/history?symbol={sym}&days=180")
              d = r.get_json()
              print(sym, r.status_code, d.get("symbol"), d.get("name"), d.get("currency"),
                    len(d.get("bars", [])), d.get("bars", [{}])[-1] if d.get("bars") else d.get("error"))
              assert r.status_code == 200 and len(d["bars"]) > 100, d
          for q in ["삼성전자", "코카콜라", "apple", "에코프로"]:
              d = c.get("/api/search", query_string={"q": q}).get_json()
              print("search", q, "->", [(i["code"], i["name"]) for i in d["items"][:4]], d.get("errors"))
              assert d["items"], d
          for sym, name in [("005930", ""), ("KO", "코카콜라"), ("AAPL", "Apple Inc.")]:
              d = c.get("/api/news", query_string={"symbol": sym, "name": name}).get_json()
              print("news", sym, d.get("query"), len(d["items"]), d.get("errors"))
              for n in d["items"][:3]:
                  print("   ", n["time"], n["source"], "|", n["title"][:70])
              assert d["items"], d
          import swing, time
          for m in ["KR", "US"]:
              t0 = time.time()
              r = swing.scan(m)
              print(f"\n== swing {m}: {r['universe']} scanned={r['scanned']} asof={r['asof']} candidates={r['total']} ({time.time()-t0:.0f}s)")
              for i in r["indexes"]:
                  print("  index", i)
              for st in r["setupStats"]:
                  print("  stats", st)
              for it in r["items"][:8]:
                  print("  ", it["score"], it["code"], it["name"], it["setupNames"], it["close"], "stop", it["stopPct"], "t1", it["t1Pct"], it["reasons"], it["cautions"])
              assert r["scanned"] >= 60, r["scanned"]
          assert c.get("/api/swing?market=KR").status_code == 200
          assert c.get("/").status_code == 200
          print("OK")
          PY
