name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'render.yaml', 'README.md', '.python-version', 'desktop/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf --cached . >/dev/null
          tail -300 build.log > failure.log
          git add -f failure.log
          git commit -m "build failure log"
          git push -f origin build-log

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ChartSignal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChartSignal-apk
          path: ChartSignal.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 차트 시그널 APK (최신)
          body: |
            휴대폰에서 아래 **ChartSignal.apk** 를 눌러 내려받아 설치하세요.
            빌드 번호: ${{ github.run_number }}
          files: ChartSignal.apk
          make_latest: true
