name: Market flow report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - name: Collect sector and macro data
        run: |
          mkdir -p report
          python - <<'PY'
          import json, yfinance as yf, pandas as pd
          groups = {
            "us_index": {"^GSPC": "S&P 500", "^IXIC": "나스닥", "^DJI": "다우", "^RUT": "러셀2000(소형주)", "RSP": "S&P500 동일가중"},
            "us_sector": {"XLK": "기술", "SMH": "반도체", "IGV": "소프트웨어", "XLC": "커뮤니케이션", "XLY": "임의소비재",
                          "XLF": "금융", "XLV": "헬스케어", "XBI": "바이오", "XLI": "산업재", "ITA": "방산·항공",
                          "XLE": "에너지", "XLU": "유틸리티", "XLP": "필수소비재", "XLB": "소재", "XLRE": "리츠",
                          "URA": "원전·우라늄", "GDX": "금광"},
            "macro": {"^VIX": "VIX(공포지수)", "^TNX": "미 10년 금리", "DX-Y.NYB": "달러지수", "KRW=X": "원/달러",
                      "GC=F": "금", "SI=F": "은", "CL=F": "WTI 유가", "BTC-USD": "비트코인", "TLT": "미 장기국채"},
            "kr_index": {"^KS11": "코스피", "^KQ11": "코스닥", "^KS200": "코스피200"},
            "kr_sector": {"091160.KS": "반도체", "305720.KS": "2차전지", "091170.KS": "은행", "102970.KS": "증권",
                          "140700.KS": "보험", "091180.KS": "자동차", "117700.KS": "건설", "117460.KS": "에너지화학",
                          "244580.KS": "바이오", "449450.KS": "방산", "228790.KS": "화장품", "139230.KS": "중공업·조선"},
          }
          tickers = [t for g in groups.values() for t in g]
          df = yf.download(tickers, period="1y", interval="1d", group_by="ticker", auto_adjust=False, progress=False, threads=True)
          out = {}
          for g, m in groups.items():
              rows = []
              for t, name in m.items():
                  try:
                      s = df[t].dropna(subset=["Close"])
                  except KeyError:
                      continue
                  if len(s) < 70:
                      continue
                  c = s["Close"]; v = s["Volume"].fillna(0)
                  def r(n): return round(float((c.iloc[-1] / c.iloc[-1 - n] - 1) * 100), 2)
                  ytd = c[c.index >= f"{c.index[-1].year}-01-01"]
                  vr = float(v.iloc[-5:].mean() / v.iloc[-65:-5].mean()) if v.iloc[-65:-5].mean() > 0 else None
                  rows.append({"ticker": t, "name": name, "date": c.index[-1].strftime("%Y-%m-%d"), "close": round(float(c.iloc[-1]), 3),
                               "d1": r(1), "d5": r(5), "d20": r(20), "d60": r(60),
                               "ytd": round(float((c.iloc[-1] / ytd.iloc[0] - 1) * 100), 2) if len(ytd) else None,
                               "fromHigh": round(float((c.iloc[-1] / c.iloc[-252:].max() - 1) * 100), 2),
                               "volRatio": round(vr, 2) if vr else None})
              out[g] = rows
          json.dump(out, open("report/market.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Save to ci-report branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp -r report /tmp/report
          git fetch origin ci-report || true
          git checkout --orphan market-tmp
          git rm -rf --cached . >/dev/null
          rm -rf ./*
          cp /tmp/report/* .
          git add -f market.json
          git commit -m "market report"
          git push -f origin market-tmp:market-report
